<style>
:root{
  --cream:#F2E2C4;
  --gold:#F6B93E;
  --gold-deep:#E8992A;
  --brown:#2A1508;
  --brown-soft:#4A2A14;
  --brown-panel:#3A1E0E;
  --flame:#E8592B;
  --flame-dark:#C23F1A;
  --white:#FFFCF6;
  --whats:#25D366;
  --whats-dark:#1EAE55;
  --line:rgba(42,21,8,0.14);
  --shadow:0 10px 30px rgba(42,21,8,0.18);
  --radius:16px;
  --font-display:'Baloo 2', system-ui, sans-serif;
  --font-body:'Work Sans', system-ui, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  color:var(--brown);
  background:
    radial-gradient(ellipse at top left, rgba(246,185,62,0.35), transparent 55%),
    linear-gradient(180deg, var(--cream) 0%, #EAD3A5 100%);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  padding-bottom:110px;
}

/* ---------- HEADER ---------- */
header.top{
  position:relative;
  padding:28px 20px 22px;
  overflow:hidden;
}
.flame-decor{
  position:absolute; inset:0; pointer-events:none; opacity:0.5;
}
.brand-row{
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  max-width:900px; margin:0 auto; position:relative; z-index:2;
}
.brand-mark{
  display:flex; align-items:center; gap:12px;
}
.logo-badge{
  width:60px; height:60px; border-radius:50%;
  background:var(--white);
  display:flex; align-items:center; justify-content:center;
  box-shadow:var(--shadow);
  flex-shrink:0;
  overflow:hidden;
  padding:9px;
  border:2px solid var(--brown);
}
.logo-img{width:100%; height:100%; object-fit:contain;}
.hero-mark{
  display:block;
  width:min(180px, 40vw);
  margin:4px auto 0;
  position:relative; z-index:2;
  filter:drop-shadow(0 6px 14px rgba(42,21,8,0.25));
}
.brand-name{
  font-family:var(--font-display);
  font-weight:800;
  font-size:22px;
  letter-spacing:0.5px;
  line-height:1.05;
  color:var(--brown);
}
.brand-name span{display:block; font-size:12px; font-weight:600; letter-spacing:3px; color:var(--flame-dark); text-transform:uppercase; margin-top:2px;}
.hero-title{
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(38px, 9vw, 64px);
  text-align:center;
  margin:8px 0 4px;
  color:var(--brown);
  letter-spacing:1px;
  position:relative; z-index:2;
}
.hero-sub{
  text-align:center;
  font-size:14.5px;
  color:var(--brown-soft);
  max-width:520px;
  margin:0 auto;
  position:relative; z-index:2;
  font-weight:500;
}

/* ---------- NAV ---------- */
nav.tabs{
  position:sticky; top:0; z-index:40;
  background:rgba(242,226,196,0.92);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  padding:10px 0;
}
.tabs-scroll{
  display:flex; gap:8px; overflow-x:auto; padding:0 16px;
  max-width:900px; margin:0 auto;
  scrollbar-width:none;
}
.tabs-scroll::-webkit-scrollbar{display:none;}
.tab-btn{
  flex:0 0 auto;
  font-family:var(--font-display);
  font-weight:600;
  font-size:14px;
  padding:9px 16px;
  border-radius:999px;
  border:2px solid transparent;
  background:rgba(255,255,255,0.5);
  color:var(--brown-soft);
  cursor:pointer;
  white-space:nowrap;
  transition:all .15s ease;
}
.tab-btn:hover{border-color:var(--gold-deep);}
.tab-btn.active{
  background:var(--flame);
  color:var(--white);
  box-shadow:0 4px 12px rgba(232,89,43,0.35);
}

/* ---------- MAIN ---------- */
main{max-width:900px; margin:0 auto; padding:8px 16px 20px;}
.section{margin-top:34px; scroll-margin-top:74px;}
.section-head{
  display:flex; align-items:baseline; gap:10px;
  margin-bottom:6px;
}
.section-title{
  font-family:var(--font-display);
  font-weight:700;
  font-size:26px;
  color:var(--brown);
}
.section-note{
  font-size:12.5px; color:var(--brown-soft); opacity:0.75; font-weight:500;
}
.section-desc{
  font-size:13.5px; color:var(--brown-soft); margin:0 0 16px; opacity:0.85;
}

.item-grid{display:flex; flex-direction:column; gap:12px;}
.item-card{
  background:var(--white);
  border-radius:var(--radius);
  padding:16px 16px;
  display:flex; align-items:center; gap:14px;
  box-shadow:0 2px 8px rgba(42,21,8,0.06);
  border:1px solid var(--line);
  transition:transform .12s ease, box-shadow .12s ease;
}
.item-card:hover{transform:translateY(-2px); box-shadow:var(--shadow);}
.item-info{flex:1; min-width:0;}
.item-name{font-family:var(--font-display); font-weight:700; font-size:16.5px; color:var(--brown);}
.item-desc{font-size:12.5px; color:var(--brown-soft); opacity:0.8; margin-top:3px; line-height:1.4;}
.item-price{font-family:var(--font-display); font-weight:700; font-size:15.5px; color:var(--flame-dark); margin-top:6px;}
.add-btn{
  flex-shrink:0;
  width:42px; height:42px; border-radius:50%;
  background:var(--flame);
  color:var(--white);
  border:none; font-size:22px; font-weight:700;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 10px rgba(232,89,43,0.35);
  transition:transform .1s ease, background .1s ease;
}
.add-btn:hover{background:var(--flame-dark); transform:scale(1.06);}
.add-btn:active{transform:scale(0.94);}

/* combo cards */
.combo-card{
  background:var(--brown-panel);
  color:var(--white);
  border-radius:var(--radius);
  padding:18px;
  box-shadow:var(--shadow);
  position:relative;
  overflow:hidden;
}
.combo-card::before{
  content:"";
  position:absolute; top:-30px; right:-30px;
  width:100px; height:100px; border-radius:50%;
  background:radial-gradient(circle, rgba(246,185,62,0.25), transparent 70%);
}
.combo-badge{
  display:inline-block;
  font-size:10.5px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase;
  color:var(--gold);
  background:rgba(246,185,62,0.15);
  padding:3px 10px; border-radius:999px;
  margin-bottom:8px;
}
.combo-name{font-family:var(--font-display); font-weight:700; font-size:19px;}
.combo-desc{font-size:12.5px; opacity:0.85; margin:6px 0 12px; line-height:1.5;}
.combo-foot{display:flex; align-items:center; justify-content:space-between;}
.combo-price{font-family:var(--font-display); font-weight:800; font-size:20px; color:var(--gold);}

/* attention box */
.attention{
  background:var(--gold);
  border-radius:var(--radius);
  padding:16px 18px;
  margin-top:32px;
  border:2px dashed var(--brown);
}
.attention-title{font-family:var(--font-display); font-weight:800; font-size:16px; color:var(--brown); margin-bottom:8px;}
.attention ul{margin:0; padding-left:18px; font-size:12.5px; color:var(--brown-soft); line-height:1.6;}

/* ---------- MODAL (add item) ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(42,21,8,0.55);
  display:none; align-items:flex-end; justify-content:center;
  z-index:100; backdrop-filter:blur(2px);
}
.overlay.open{display:flex;}
.modal{
  background:var(--white);
  width:100%; max-width:520px;
  border-radius:22px 22px 0 0;
  padding:22px 20px 20px;
  max-height:88vh; overflow-y:auto;
  animation:slideUp .22s ease;
}
@keyframes slideUp{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
@media (min-width:560px){
  .overlay{align-items:center;}
  .modal{border-radius:22px;}
}
.modal-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
.modal-title{font-family:var(--font-display); font-weight:700; font-size:20px;}
.modal-desc{font-size:12.5px; color:var(--brown-soft); opacity:0.85; margin-top:4px; line-height:1.5;}
.close-x{
  background:var(--cream); border:none; width:32px; height:32px; border-radius:50%;
  font-size:16px; cursor:pointer; flex-shrink:0; color:var(--brown);
}
.modal-price{font-family:var(--font-display); font-weight:800; color:var(--flame-dark); font-size:17px; margin-top:10px;}

.option-block{margin-top:18px;}
.option-label{font-family:var(--font-display); font-weight:700; font-size:14px; margin-bottom:8px; display:flex; justify-content:space-between;}
.option-hint{font-size:11px; font-weight:500; color:var(--brown-soft); opacity:0.7;}
.choice-row{
  display:flex; gap:8px; flex-wrap:wrap;
}
.choice-chip{
  padding:8px 14px; border-radius:999px; border:2px solid var(--line);
  font-size:13px; font-weight:600; cursor:pointer; background:var(--white);
  transition:all .12s ease;
}
.choice-chip.selected{background:var(--flame); border-color:var(--flame); color:var(--white);}

.extra-row{
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 0; border-bottom:1px solid var(--line);
  font-size:13.5px;
}
.extra-row:last-child{border-bottom:none;}
.extra-name{font-weight:600;}
.extra-price{color:var(--brown-soft); font-size:12px; margin-left:6px;}
.stepper{display:flex; align-items:center; gap:10px;}
.step-btn{
  width:28px; height:28px; border-radius:50%; border:2px solid var(--flame);
  background:var(--white); color:var(--flame); font-size:16px; font-weight:700;
  cursor:pointer; display:flex; align-items:center; justify-content:center; line-height:1;
}
.step-btn.filled{background:var(--flame); color:var(--white);}
.step-count{min-width:16px; text-align:center; font-weight:700; font-size:14px;}

.notes-area{
  width:100%; margin-top:16px; padding:12px; border-radius:12px;
  border:1.5px solid var(--line); font-family:var(--font-body); font-size:13px;
  resize:none; min-height:56px;
}

.modal-footer{
  display:flex; align-items:center; gap:12px; margin-top:20px;
}
.qty-control{
  display:flex; align-items:center; gap:14px;
  background:var(--cream); border-radius:999px; padding:6px 14px;
}
.qty-btn{
  width:30px; height:30px; border-radius:50%; border:none;
  background:var(--brown); color:var(--white); font-size:17px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.qty-num{font-weight:700; font-size:15px; min-width:16px; text-align:center;}
.confirm-add-btn{
  flex:1; background:var(--flame); color:var(--white); border:none;
  padding:14px 16px; border-radius:999px; font-family:var(--font-display);
  font-weight:700; font-size:15px; cursor:pointer; box-shadow:0 4px 12px rgba(232,89,43,0.35);
}
.confirm-add-btn:hover{background:var(--flame-dark);}

/* ---------- FLOATING CART ---------- */
.fab-cart{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  z-index:60;
  background:var(--brown);
  color:var(--white);
  border:none; border-radius:999px;
  padding:14px 24px;
  display:flex; align-items:center; gap:12px;
  font-family:var(--font-display); font-weight:700; font-size:15px;
  cursor:pointer; box-shadow:0 10px 26px rgba(42,21,8,0.4);
  transition:transform .12s ease;
}
.fab-cart:hover{transform:translateX(-50%) translateY(-2px);}
.fab-cart .count{
  background:var(--flame); color:var(--white); border-radius:50%;
  width:24px; height:24px; display:flex; align-items:center; justify-content:center;
  font-size:12.5px;
}
.fab-cart .total{color:var(--gold);}
.fab-cart.hidden{display:none;}

/* ---------- CART DRAWER (receipt style) ---------- */
.cart-overlay{
  position:fixed; inset:0; background:rgba(42,21,8,0.6);
  display:none; z-index:110; justify-content:flex-end;
}
.cart-overlay.open{display:flex;}
.cart-drawer{
  background:var(--cream);
  width:100%; max-width:440px; height:100%;
  overflow-y:auto;
  animation:slideLeft .25s ease;
  padding-bottom:30px;
}
@keyframes slideLeft{from{transform:translateX(100%);} to{transform:translateX(0);}}
.receipt{
  background:var(--white);
  margin:16px;
  border-radius:10px;
  box-shadow:0 4px 20px rgba(42,21,8,0.15);
  position:relative;
}
.receipt::before, .receipt::after{
  content:"";
  position:absolute; left:0; right:0; height:14px;
  background:
    radial-gradient(circle 7px at 10px 0, transparent 7px, var(--cream) 7.5px) ,
    radial-gradient(circle 7px at 30px 0, transparent 7px, var(--cream) 7.5px),
    radial-gradient(circle 7px at 50px 0, transparent 7px, var(--cream) 7.5px),
    radial-gradient(circle 7px at 70px 0, transparent 7px, var(--cream) 7.5px);
  background-size:20px 14px;
  display:none;
}
.cart-header{
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 20px 6px;
}
.cart-title{font-family:var(--font-display); font-weight:800; font-size:20px;}
.cart-empty{padding:60px 30px; text-align:center; color:var(--brown-soft);}
.cart-empty-icon{font-size:44px; margin-bottom:10px;}

.receipt-inner{padding:16px 20px 20px;}
.receipt-line-item{
  padding:10px 0; border-bottom:1px dashed var(--line);
}
.ri-top{display:flex; justify-content:space-between; gap:8px; align-items:flex-start;}
.ri-name{font-family:var(--font-display); font-weight:700; font-size:14.5px;}
.ri-price{font-weight:700; font-size:14px; color:var(--flame-dark); white-space:nowrap;}
.ri-detail{font-size:11.5px; color:var(--brown-soft); opacity:0.8; margin-top:3px; line-height:1.5;}
.ri-controls{
  display:flex; align-items:center; justify-content:space-between; margin-top:8px;
}
.ri-qty{display:flex; align-items:center; gap:8px;}
.mini-btn{
  width:24px; height:24px; border-radius:50%; border:1.5px solid var(--brown); background:var(--white);
  font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.remove-link{
  font-size:11.5px; color:var(--flame-dark); background:none; border:none; cursor:pointer;
  font-weight:600; text-decoration:underline;
}

.summary-row{display:flex; justify-content:space-between; padding:6px 0; font-size:13.5px;}
.summary-row.total{font-family:var(--font-display); font-weight:800; font-size:18px; border-top:2px solid var(--brown); margin-top:8px; padding-top:12px;}

.field-group{margin:14px 0;}
.field-label{font-size:12.5px; font-weight:700; margin-bottom:6px; display:block; color:var(--brown-soft);}
.field-input, .field-select, textarea.field-input{
  width:100%; padding:11px 12px; border-radius:10px; border:1.5px solid var(--line);
  font-family:var(--font-body); font-size:13.5px; background:var(--white);
}
.radio-group{display:flex; gap:10px;}
.radio-opt{
  flex:1; text-align:center; padding:10px; border-radius:10px; border:2px solid var(--line);
  font-size:13px; font-weight:700; cursor:pointer;
}
.radio-opt.selected{border-color:var(--flame); background:rgba(232,89,43,0.08); color:var(--flame-dark);}

.send-btn{
  width:100%; background:var(--whats); color:var(--white); border:none;
  padding:15px; border-radius:999px; font-family:var(--font-display); font-weight:700; font-size:15.5px;
  display:flex; align-items:center; justify-content:center; gap:10px; cursor:pointer;
  box-shadow:0 6px 16px rgba(37,211,102,0.4); margin-top:14px;
}
.send-btn:hover{background:var(--whats-dark);}
.send-btn:disabled{background:#B9B0A0; box-shadow:none; cursor:not-allowed;}
.small-note{font-size:11px; color:var(--brown-soft); opacity:0.75; text-align:center; margin-top:10px; line-height:1.5;}

@media(max-width:480px){
  .cart-drawer{max-width:100%;}
}
</style>
</head>

/* ======================= RENDER MENU ======================= */
function renderTabs(){
  const wrap = document.getElementById("tabsScroll");
  wrap.innerHTML = CATEGORIES.map(c=>`<button class="tab-btn" data-cat="${c.id}">${c.label}</button>`).join("");
  wrap.querySelectorAll(".tab-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      document.getElementById("sec-"+btn.dataset.cat).scrollIntoView({behavior:"smooth", block:"start"});
    });
  });
}

function renderMenu(){
  const main = document.getElementById("menuMain");
  main.innerHTML = CATEGORIES.map(cat=>{
    const itemsHtml = cat.combo
      ? cat.items.map(it=>`
        <div class="combo-card">
          <span class="combo-badge">${it.tag||"Combo"}</span>
          <div class="combo-name">${it.name}</div>
          <div class="combo-desc">${it.desc}</div>
          <div class="combo-foot">
            <span class="combo-price">${brl(it.price)}</span>
            <button class="add-btn" data-item="${it.id}">+</button>
          </div>
        </div>
      `).join("")
      : cat.items.map(it=>`
        <div class="item-card">
          <div class="item-info">
            <div class="item-name">${it.name}</div>
            ${it.desc?`<div class="item-desc">${it.desc}</div>`:""}
            <div class="item-price">${brl(it.price)}</div>
          </div>
          <button class="add-btn" data-item="${it.id}">+</button>
        </div>
      `).join("");

    return `
      <section class="section" id="sec-${cat.id}">
        <div class="section-head"><h2 class="section-title">${cat.title}</h2></div>
        ${cat.desc?`<p class="section-desc">${cat.desc}</p>`:""}
        <div class="${cat.combo? 'item-grid':'item-grid'}" style="${cat.combo? 'display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));':''}">
          ${itemsHtml}
        </div>
      </section>
    `;
  }).join("") + `
    <div class="attention">
      <div class="attention-title">⚠️ Atenção</div>
      <ul>
        <li>Não emprestamos casco (garrafas retornáveis).</li>
        <li>Não realizamos alteração por outro ingrediente, apenas acrescentamos.</li>
        <li>Informe se quer o item completo ou simples — se não for informado, vai com todos os ingredientes padrão.</li>
      </ul>
    </div>
  `;

  main.querySelectorAll(".add-btn").forEach(btn=>{
    btn.addEventListener("click", ()=> openItemModal(btn.dataset.item));
  });

  // scrollspy for active tab
  const sections = CATEGORIES.map(c=>document.getElementById("sec-"+c.id));
  const tabBtns = () => Array.from(document.querySelectorAll(".tab-btn"));
  const obs = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        const id = entry.target.id.replace("sec-","");
        tabBtns().forEach(b=>b.classList.toggle("active", b.dataset.cat===id));
      }
    });
  }, {rootMargin:"-100px 0px -70% 0px"});
  sections.forEach(s=> s && obs.observe(s));
}

/* ======================= ITEM MODAL ======================= */
function openItemModal(itemId){
  const found = findItem(itemId);
  if(!found) return;
  currentItem = { ...found.item, catId: found.cat.id, allowExtras: found.cat.allowExtras };
  currentItem.qty = 1;
  currentItem.selectedExtras = {}; // id -> qty
  currentItem.flavor = currentItem.flavorChoice ? currentItem.flavorChoice[0] : null;
  currentItem.notes = "";

  renderItemModal();
  document.getElementById("itemOverlay").classList.add("open");
}

function renderItemModal(){
  const it = currentItem;
  let extrasHtml = "";
  if(it.allowExtras){
    extrasHtml = `
      <div class="option-block">
        <div class="option-label"><span>Adicionais</span><span class="option-hint">opcional</span></div>
        ${ADICIONAIS.map(ad=>`
          <div class="extra-row">
            <div><span class="extra-name">${ad.name}</span><span class="extra-price">+${brl(ad.price)}</span></div>
            <div class="stepper">
              <button class="step-btn" data-extra="${ad.id}" data-dir="-1">−</button>
              <span class="step-count" id="cnt-${ad.id}">${it.selectedExtras[ad.id]||0}</span>
              <button class="step-btn" data-extra="${ad.id}" data-dir="1">+</button>
            </div>
          </div>
        `).join("")}
      </div>
    `;
  }

  let flavorHtml = "";
  if(it.flavorChoice){
    flavorHtml = `
      <div class="option-block">
        <div class="option-label">Escolha o sabor</div>
        <div class="choice-row">
          ${it.flavorChoice.map(f=>`<button class="choice-chip ${it.flavor===f?'selected':''}" data-flavor="${f}">${f}</button>`).join("")}
        </div>
      </div>
    `;
  }

  document.getElementById("itemModal").innerHTML = `
    <div class="modal-head">
      <div>
        <div class="modal-title">${it.name}</div>
        ${it.desc?`<div class="modal-desc">${it.desc}</div>`:""}
        <div class="modal-price">${brl(it.price)}</div>
      </div>
      <button class="close-x" id="modalClose">✕</button>
    </div>
    ${flavorHtml}
    ${extrasHtml}
    <div class="option-block">
      <div class="option-label">Observações</div>
      <textarea class="notes-area" id="itemNotes" placeholder="Ex: sem cebola, ponto da carne, etc.">${it.notes}</textarea>
    </div>
    <div class="modal-footer">
      <div class="qty-control">
        <button class="qty-btn" id="qtyMinus">−</button>
        <span class="qty-num" id="qtyNum">${it.qty}</span>
        <button class="qty-btn" id="qtyPlus">+</button>
      </div>
      <button class="confirm-add-btn" id="confirmAdd">Adicionar · ${brl(itemTotalPrice(it))}</button>
    </div>
  `;

  document.getElementById("modalClose").addEventListener("click", closeItemModal);
  document.getElementById("qtyMinus").addEventListener("click", ()=>{ if(it.qty>1){it.qty--; refreshFooter();} });
  document.getElementById("qtyPlus").addEventListener("click", ()=>{ it.qty++; refreshFooter(); });
  document.getElementById("itemNotes").addEventListener("input", (e)=>{ it.notes = e.target.value; });
  document.getElementById("confirmAdd").addEventListener("click", addCurrentToCart);

  if(it.allowExtras){
    document.querySelectorAll(".step-btn").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const id = btn.dataset.extra;
        const dir = parseInt(btn.dataset.dir);
        const cur = it.selectedExtras[id]||0;
        const next = Math.max(0, cur+dir);
        it.selectedExtras[id] = next;
        document.getElementById("cnt-"+id).textContent = next;
        refreshFooter();
      });
    });
  }
  if(it.flavorChoice){
    document.querySelectorAll(".choice-chip").forEach(chip=>{
      chip.addEventListener("click", ()=>{
        it.flavor = chip.dataset.flavor;
        document.querySelectorAll(".choice-chip").forEach(c=>c.classList.toggle("selected", c.dataset.flavor===it.flavor));
      });
    });
  }
}

function itemTotalPrice(it){
  let total = it.price;
  if(it.allowExtras){
    for(const [id,qty] of Object.entries(it.selectedExtras)){
      const ad = ADICIONAIS.find(a=>a.id===id);
      if(ad) total += ad.price*qty;
    }
  }
  return total * it.qty;
}

function refreshFooter(){
  document.getElementById("qtyNum").textContent = currentItem.qty;
  document.getElementById("confirmAdd").textContent = `Adicionar · ${brl(itemTotalPrice(currentItem))}`;
}

function closeItemModal(){
  document.getElementById("itemOverlay").classList.remove("open");
  currentItem = null;
}

function addCurrentToCart(){
  const it = currentItem;
  const extras = it.allowExtras ? Object.entries(it.selectedExtras)
    .filter(([id,qty])=>qty>0)
    .map(([id,qty])=>{ const ad=ADICIONAIS.find(a=>a.id===id); return {name:ad.name, price:ad.price, qty}; }) : [];

  cart.push({
    uid: uid(),
    name: it.name,
    unitBase: it.price,
    qty: it.qty,
    extras,
    flavor: it.flavor,
    notes: it.notes.trim(),
  });
  closeItemModal();
  updateFab();
  flashCartOpen();
}

function flashCartOpen(){
  // brief feedback: pulse fab (kept simple, just refresh)
}

/* ======================= CART ======================= */
function lineUnitPrice(line){
  const extrasTotal = line.extras.reduce((s,e)=> s + e.price*e.qty, 0);
  return line.unitBase + extrasTotal;
}
function lineTotal(line){ return lineUnitPrice(line) * line.qty; }
function cartTotal(){ return cart.reduce((s,l)=> s+lineTotal(l), 0); }
function cartCount(){ return cart.reduce((s,l)=> s+l.qty, 0); }

function updateFab(){
  const fab = document.getElementById("fabCart");
  const count = cartCount();
  if(count===0){ fab.classList.add("hidden"); return; }
  fab.classList.remove("hidden");
  document.getElementById("fabCount").textContent = count;
  document.getElementById("fabTotal").textContent = brl(cartTotal());
}

function renderCart(){
  const body = document.getElementById("cartBody");
  if(cart.length===0){
    body.innerHTML = `<div class="cart-empty"><div class="cart-empty-icon">🍔</div>Seu carrinho está vazio.<br>Escolha algo gostoso no cardápio!</div>`;
    return;
  }

  const linesHtml = cart.map(line=>{
    const detailParts = [];
    if(line.flavor) detailParts.push(`Sabor: ${line.flavor}`);
    if(line.extras.length) detailParts.push(line.extras.map(e=> e.qty>1? `${e.qty}x ${e.name}` : e.name).join(", "));
    if(line.notes) detailParts.push(`Obs: ${line.notes}`);
    return `
      <div class="receipt-line-item" data-uid="${line.uid}">
        <div class="ri-top">
          <div class="ri-name">${line.qty}x ${line.name}</div>
          <div class="ri-price">${brl(lineTotal(line))}</div>
        </div>
        ${detailParts.length? `<div class="ri-detail">${detailParts.join(" · ")}</div>` : ""}
        <div class="ri-controls">
          <div class="ri-qty">
            <button class="mini-btn" data-act="dec">−</button>
            <span>${line.qty}</span>
            <button class="mini-btn" data-act="inc">+</button>
          </div>
          <button class="remove-link" data-act="remove">remover</button>
        </div>
      </div>
    `;
  }).join("");

  body.innerHTML = `
    <div class="receipt">
      <div class="receipt-inner">
        ${linesHtml}
        <div class="summary-row total"><span>Total</span><span>${brl(cartTotal())}</span></div>
      </div>
    </div>

    <div class="receipt">
      <div class="receipt-inner">
        <div class="field-group">
          <span class="field-label">Como você quer receber?</span>
          <div class="radio-group">
            <div class="radio-opt selected" data-mode="entrega">Entrega</div>
            <div class="radio-opt" data-mode="retirada">Retirar no local</div>
          </div>
        </div>
        <div class="field-group">
          <span class="field-label">Seu nome</span>
          <input class="field-input" id="custName" placeholder="Como podemos te chamar?">
        </div>
        <div class="field-group" id="addressGroup">
          <span class="field-label">Endereço para entrega</span>
          <input class="field-input" id="custAddress" placeholder="Rua, número, bairro, referência">
        </div>
        <div class="field-group">
          <span class="field-label">Forma de pagamento</span>
          <select class="field-select" id="custPayment">
            <option>Pix</option>
            <option>Dinheiro</option>
            <option>Cartão de crédito</option>
            <option>Cartão de débito</option>
          </select>
        </div>
        <button class="send-btn" id="sendOrder">📲 Enviar pedido pelo WhatsApp</button>
        <div class="small-note">Você será direcionado ao WhatsApp da lanchonete com o pedido já preenchido. Confirme os dados antes de enviar.</div>
      </div>
    </div>
  `;

  body.querySelectorAll(".receipt-line-item").forEach(row=>{
    const lineUid = row.dataset.uid;
    row.querySelectorAll("[data-act]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const line = cart.find(l=>l.uid===lineUid);
        if(!line) return;
        const act = btn.dataset.act;
        if(act==="inc") line.qty++;
        else if(act==="dec"){ line.qty--; if(line.qty<=0){ cart = cart.filter(l=>l.uid!==lineUid); } }
        else if(act==="remove"){ cart = cart.filter(l=>l.uid!==lineUid); }
        renderCart();
        updateFab();
      });
    });
  });

  const radios = body.querySelectorAll(".radio-opt");
  let mode = "entrega";
  radios.forEach(r=> r.addEventListener("click", ()=>{
    radios.forEach(x=>x.classList.remove("selected"));
    r.classList.add("selected");
    mode = r.dataset.mode;
    document.getElementById("addressGroup").style.display = mode==="entrega" ? "block" : "none";
  }));

  document.getElementById("sendOrder").addEventListener("click", ()=> sendToWhatsapp(mode));
}

function openCart(){
  renderCart();
  document.getElementById("cartOverlay").classList.add("open");
}
function closeCart(){
  document.getElementById("cartOverlay").classList.remove("open");
}

/* ======================= WHATSAPP MESSAGE ======================= */
function sendToWhatsapp(){
  const mode = document.querySelector(".radio-opt.selected")?.dataset.mode || "entrega";
  const name = document.getElementById("custName").value.trim();
  const address = document.getElementById("custAddress") ? document.getElementById("custAddress").value.trim() : "";
  const payment = document.getElementById("custPayment").value;

  if(cart.length===0) return;
  if(!name){ alert("Por favor, preencha seu nome antes de enviar o pedido."); return; }
  if(mode==="entrega" && !address){ alert("Por favor, informe o endereço de entrega."); return; }

  let msg = `*Pedido — Sobre Rodas*\n\n`;
  msg += ` Nome: ${name}\n`;
  msg += ` ${mode==="entrega" ? "Entrega: "+address : "Retirada no local"}\n`;
  msg += ` Pagamento: ${payment}\n\n`;
  msg += `*Itens do pedido:*\n`;
  cart.forEach(line=>{
    msg += `\n ${line.qty}x ${line.name} — ${brl(lineTotal(line))}\n`;
    if(line.flavor) msg += `   Sabor: ${line.flavor}\n`;
    if(line.extras.length){
      line.extras.forEach(e=> msg += `   + ${e.qty>1? e.qty+"x ":""}${e.name}\n`);
    }
    if(line.notes) msg += `   Obs: ${line.notes}\n`;
  });
  msg += `\n*Total: ${brl(cartTotal())}*\n`;
  msg += `\n_Pedido gerado pelo cardápio digital_`;

  const url = `https://wa.me/${5521995314228}?text=${encodeURIComponent(msg)}`;
  window.open(url, "_blank");
}

/* ======================= INIT ======================= */
document.getElementById("fabCart").addEventListener("click", openCart);
document.getElementById("closeCart").addEventListener("click", closeCart);
document.getElementById("cartOverlay").addEventListener("click", (e)=>{ if(e.target.id==="cartOverlay") closeCart(); });
document.getElementById("itemOverlay").addEventListener("click", (e)=>{ if(e.target.id==="itemOverlay") closeItemModal(); });

renderTabs();
renderMenu();
updateFab();
</script>
</body>
</html>
